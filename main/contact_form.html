  <!-- Contact Form -->
  <div class="contact-form">
    <h5>Send us a Message</h5>

    <form id="contactForm" novalidate>
      <div class="form-group">
        <label for="name">Your Name</label>
        <input id="name" name="name" type="text" required autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="email">Your Email</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text" required />
      </div>

      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea
          id="message"
          name="message"
          class="form-control"
          rows="5"
          required
        ></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <script>
          (function () {
            // initialize with your public key
            emailjs.init("ZAX-M2UefU-IHTKm4");
          })();

          const form = document.getElementById("contactForm");
          const statusEl = document.getElementById("status");

          form.addEventListener("submit", function (e) {
            e.preventDefault();

            // small client-side validation
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const subject = document.getElementById("subject").value.trim();
            const message = document.getElementById("message").value.trim();

            if (!name || !email || !subject || !message) {
              statusEl.style.color = "#d93a3a";
              statusEl.textContent = "Please fill in all fields.";
              return;
            }

            statusEl.style.color = "#0b4a5a";
            statusEl.textContent = "Sending...";

            const params = {
              from_name: name,
              from_email: email,
              subject,
              message,
            };

            // send main email
            emailjs
              .send("service_18mblod", "template_ovj77an", params)
              .then(() => {
                // send auto-reply template (optional)
                emailjs
                  .send("service_18mblod", "template_blbfaji", params)
                  .catch(() => {
                    /* ignore autoreply error */
                  });

                statusEl.style.color = "green";
                statusEl.textContent = "Message sent successfully!";
                form.reset();
                // keep status visible for a short while on mobile
                setTimeout(() => {
                  statusEl.textContent = "";
                }, 5000);
              })
              .catch(() => {
                statusEl.style.color = "#d93a3a";
                statusEl.textContent =
                  "Failed to send message. Try again later.";
              });
          });
        </script>
  </div>
